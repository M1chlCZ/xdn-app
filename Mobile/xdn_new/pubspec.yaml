name: digitalnote
description: DigitalNote App Wallet

publish_to: 'none'

version: 1.1.58+139

environment:
  sdk: '>=3.3.0-279.2.beta <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^19.4.1
  firebase_messaging: any
  firebase_core: any
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  sqflite: ^2.4.2
  sprintf: ^7.0.0
  get_it: ^8.2.0
  auto_size_text: ^3.0.0
  share_plus: ^11.1.0
  vibration: ^3.1.3
  flutter_udid: ^4.0.0
  url_launcher: ^6.3.2
  image_cropper: ^9.1.0
  image_picker: ^1.2.0
  path_provider:  ^2.1.5
  flutter_native_image_v2: ^1.1.2+4
  flutter_phoenix: ^1.1.1
  app_badge_plus: ^1.2.3
  bubble: ^1.2.1
  flutter_typeahead: ^5.2.0
  flutter_linkify: ^6.0.0
  vector_math: ^2.1.4
  font_awesome_flutter: ^10.10.0
  flutter_countdown_timer: ^4.1.0
  shared_preferences: ^2.5.3
  badges: ^3.1.2
  crypto: any
  mobile_scanner: ^7.0.1
  fl_chart: ^1.0.0
  jiffy: ^6.2.1
  permission_handler: ^12.0.1
  local_auth: ^2.3.0
  walletconnect_qrcode_modal_dart: ^0.4.3
  web3dart: ^2.7.1
  decimal: ^3.2.4
  rxdart: ^0.27.7
  open_filex: ^4.7.0
  external_path: ^2.2.0
  path: ^1.9.1
  avatar_glow: ^3.0.1
  styled_text: ^8.1.0
  package_info_plus: ^8.3.1
  device_info_plus: ^11.5.0
  slide_to_act: any
  flutter_native_splash: ^2.4.6
  screenshot: ^3.0.0
  flutter_riverpod: ^2.6.1
  grpc: ^4.1.0
  model_viewer_plus: ^1.9.3
  flutter_biometrics:
    git:
      url: https://github.com/M1chlCZ/flutter_biometrics.git
      ref: main
  walletconnect_dart: any
  protobuf: any
  cupertino_icons: ^1.0.8

dev_dependencies:
  change_app_package_name: ^1.5.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - images/
    - assets/

  fonts:
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-Regular.ttf
        - asset: fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: fonts/Montserrat-Light.ttf
          weight: 200
